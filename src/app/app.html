@if (isLoggedIn()) {
  <app-navbar></app-navbar>
  <app-mobile-header></app-mobile-header>

  <div class="flex min-h-screen w-full bg-gradient-to-br from-slate-50 via-slate-50 to-slate-100 overflow-hidden">
    <main class="flex-1 lg:ml-64 overflow-y-auto transition-all duration-300 ease-out overflow-x-hidden pt-16 pb-20 lg:pt-0 lg:pb-0" id="mainContent">
      <div class="min-h-full w-full p-2 sm:p-4 md:p-6 lg:p-8">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <app-mobile-nav></app-mobile-nav>
  <app-fab></app-fab>

  @if (isTransactionModalOpen()) {
  <app-add-transaction
    [user]="currentUser()"
    [editData]="selectedTransaction()"
    (closeModel)="closeTransactionModal()"
    (transactionSaved)="onTransactionSaved()">
  </app-add-transaction>
  }
} @else {
  <router-outlet></router-outlet>
}
