<div (click)="close()"
    class="fixed inset-0 z-50 flex items-center justify-center pointer-events-auto animate-modal-backdrop px-4 sm:px-0">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-md"></div>

    <div (click)="$event.stopPropagation()"
        class="relative backdrop-blur-xl bg-white/95 rounded-2xl shadow-2xl border border-white/30 w-full max-w-md overflow-hidden animate-modal-content max-h-[90vh] overflow-y-auto">

        <div class="px-6 py-4 border-b border-white/20 flex justify-between items-center bg-gradient-to-r from-emerald-50/50 to-teal-50/50">
            <h3 class="font-bold text-lg bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">
                📝 {{ editData ? 'แก้ไขรายการ' : 'จดบันทึกรายการ' }}
            </h3>
            <button (click)="close()" class="text-slate-400 hover:text-red-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="p-6 space-y-5">

            <!-- Type Switcher -->
            <div class="flex bg-gradient-to-r from-slate-50 to-slate-100 p-1.5 rounded-xl gap-1">
                <button (click)="setType('income')"
                    class="flex-1 py-2 px-2 rounded-lg text-sm font-bold transition-all duration-200"
                    [ngClass]="type() === 'income' ? 'bg-white text-emerald-600 shadow-md' : 'text-slate-500 hover:text-slate-700'">
                    + รายรับ
                </button>
                <button (click)="setType('expense')"
                    class="flex-1 py-2 px-2 rounded-lg text-sm font-bold transition-all duration-200"
                    [ngClass]="type() === 'expense' ? 'bg-white text-red-600 shadow-md' : 'text-slate-500 hover:text-slate-700'">
                    - รายจ่าย
                </button>
            </div>

            <!-- Date -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider">วันที่</label>
                <input type="date" [(ngModel)]="formData.date"
                    class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent bg-white/80 transition-all shadow-sm">
            </div>

            <!-- Category Grid -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider">หมวดหมู่</label>
                <div class="grid grid-cols-3 gap-2">
                    @for (cat of categoryOptions(); track cat.value) {
                        <button type="button" (click)="formData.title = cat.value"
                            class="flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-lg border transition-all duration-200"
                            [ngClass]="formData.title === cat.value
                                ? (type() === 'income'
                                    ? 'border-emerald-500 bg-emerald-50 shadow-md scale-105'
                                    : 'border-red-500 bg-red-50 shadow-md scale-105')
                                : 'border-slate-200 bg-white/60 hover:border-slate-300 hover:bg-white'">
                            <span class="text-xl">{{ cat.icon }}</span>
                            <span class="text-xs font-medium text-slate-700">{{ cat.label }}</span>
                        </button>
                    }
                </div>
            </div>

            <!-- Amount -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider">จำนวนเงิน (บาท)</label>
                <div class="relative">
                    <span class="absolute left-4 top-3 font-bold"
                        [ngClass]="type() === 'income' ? 'text-emerald-600' : 'text-red-600'">฿</span>
                    <input type="number" [(ngModel)]="formData.amount" placeholder="0.00" inputmode="decimal"
                        class="w-full pl-9 pr-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent bg-white/80 font-bold text-slate-700 transition-all shadow-sm">
                </div>
            </div>

            <!-- Note (optional) -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider">หมายเหตุ <span class="text-slate-400 font-normal normal-case">(ไม่บังคับ)</span></label>
                <textarea [(ngModel)]="formData.note" rows="2" placeholder="เพิ่มรายละเอียด..."
                    class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent bg-white/80 transition-all shadow-sm resize-none"></textarea>
            </div>

        </div>

        <div class="p-4 border-t border-white/20 bg-gradient-to-r from-slate-50/50 to-slate-100/50">
            <button (click)="saveTransaction()" [disabled]="isSaving"
                class="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-bold py-2.5 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
                @if (isSaving) {
                    <span>กำลังบันทึก...</span>
                } @else {
                    <span>{{ editData ? 'อัปเดต' : 'บันทึก' }}</span>
                }
            </button>
        </div>

    </div>
</div>
