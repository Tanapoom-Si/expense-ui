@if (showToast) {
<div class="fixed bottom-5 right-5 z-[100] animate-in slide-in-from-right duration-300">
    <div [class]="toastType === 'success' ? 'bg-emerald-500' : 'bg-rose-500'"
        class="flex items-center gap-3 px-6 py-3 rounded-xl shadow-2xl text-white">

        @if (toastType === 'success') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        }

        <span class="font-medium">{{ toastMessage }}</span>
    </div>
</div>
}

<div (click)="close()"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">

    <div (click)="$event.stopPropagation()"
        class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-in zoom-in-95 duration-200">

        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
            <h3 class="font-bold text-lg text-slate-800">📝 จดบันทึกรายการ</h3>
            <button (click)="close()" class="text-slate-400 hover:text-red-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="p-6 space-y-4">

            <div class="flex bg-slate-100 p-1 rounded-lg">
                <button (click)="setType('income')" class="flex-1 py-2 rounded-md text-sm font-bold transition-all"
                    [ngClass]="formData.type === 'income' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500'">
                    + รายรับ
                </button>

                <button (click)="setType('expense')" class="flex-1 py-2 rounded-md text-sm font-bold transition-all"
                    [ngClass]="formData.type === 'expense' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-500'">
                    - รายจ่าย
                </button>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">วันที่</label>
                <input type="date" [(ngModel)]="formData.date"
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">รายการ</label>
                <input type="text" [(ngModel)]="formData.title" placeholder="เช่น เงินเดือน"
                    class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    required>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">จำนวนเงิน (บาท)</label>
                <div class="relative">
                    <span class="absolute left-3 top-2 text-slate-400">฿</span>
                    <input type="number" [(ngModel)]="formData.amount" placeholder="0.00"
                        class="w-full pl-8 pr-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 font-bold text-slate-700"
                        required>
                </div>
            </div>

        </div>

        <div class="p-4 border-t border-slate-100 bg-slate-50">
            <button (click)="saveTransaction()" [disabled]="isSaving"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow-lg shadow-emerald-200 transition-all">
                @if(isSaving){
                <span>กำลังบันทึกข้อมูล...</span>
                } @else{
                <span>บันทึกข้อมูล</span>
                }
            </button>
        </div>

    </div>

</div>
