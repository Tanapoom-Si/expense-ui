<div class="max-w-2xl mx-auto">
    <div class="backdrop-blur-xl bg-white/90 border border-white/30 p-6 rounded-2xl shadow-xl">
        <div class="flex items-center gap-3 mb-6">
            <div class="p-3 bg-gradient-to-br from-emerald-100 to-emerald-50 rounded-lg shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                </svg>
            </div>
            <h3 class="text-lg font-bold bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">
                {{userData ? 'แก้ไขข้อมูลผู้ใช้งาน':'เพิ่มผู้ใช้งานใหม่'}}
            </h3>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <div class="col-span-1">
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">ชื่อผู้ใช้</label>
                <input [(ngModel)]="username" [disabled]="userData" type="text" 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-white/80 focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition-all text-sm shadow-sm hover:shadow-md disabled:bg-slate-100 disabled:text-slate-500" 
                    placeholder="ระบุชื่อผู้ใช้">
            </div>

             <div class="col-span-1">
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">รหัสผ่าน</label>
                <input [(ngModel)]="password" type="text" 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-white/80 focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition-all text-sm shadow-sm hover:shadow-md" 
                    placeholder="ระบุรหัสผ่าน">
            </div>

            <div class="col-span-1">
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">อีเมล</label>
                <input [(ngModel)]="email" type="email" 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-white/80 focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition-all text-sm shadow-sm hover:shadow-md" 
                    placeholder="ระบุอีเมล">
            </div>

            <div class="col-span-1">
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">สิทธิ์การใช้งาน</label>
                <div class="relative">
                    <select [(ngModel)]="roleValue" class="w-full pl-4 pr-10 py-2.5 rounded-lg border border-slate-200 bg-white/80 appearance-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition-all cursor-pointer text-sm text-slate-700 shadow-sm hover:shadow-md">
                        <option value="0">User</option>
                        <option value="1">Admin</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                        <svg class="h-4 w-4 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="col-span-1 md:col-span-2 mt-4">
                <button (click)="saveUser()"
                    class="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-bold rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 flex justify-center items-center gap-2 transform hover:scale-105">
                    <span>บันทึกข้อมูล</span>
                </button>
            </div>
        </div>
    </div>
</div>
