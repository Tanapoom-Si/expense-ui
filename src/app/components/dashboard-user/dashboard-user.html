@if (isAdding()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center pointer-events-auto animate-modal-backdrop">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-md"></div>

    <div class="relative w-full max-w-2xl animate-modal-content">
      <button (click)="toggleForm()" 
        class="absolute top-4 right-4 z-10 p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-all transform hover:scale-110">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <app-add-user 
        [userData]="selectedUser"
        (userAdded)="fetchUsers(); toggleForm()">
      </app-add-user>

    </div>
  </div>
}

<main class="min-h-screen bg-gradient-to-br from-slate-50 via-emerald-50 to-slate-100 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-4xl mx-auto">
    <div class="backdrop-blur-xl bg-white/80 rounded-2xl shadow-xl border border-white/20 p-6 sm:p-8 space-y-6">
      
      <div class="flex justify-between items-center flex-wrap gap-4">
        <div>
          <h1 class="text-4xl font-bold bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">User Management</h1>
          <p class="text-slate-600 font-medium mt-1">Manage system users and permissions</p>
        </div>
        <button (click)="toggleForm()" 
          class="bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 px-6 py-2.5 text-white font-bold rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 flex items-center gap-2 transform hover:scale-105">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          <span>เพิ่มผู้ใช้งาน</span>
        </button>
      </div>

      <div class="space-y-4">
        <div class="flex items-center gap-2 mb-4">
          <h2 class="text-xl font-bold text-slate-800">รายชื่อผู้ใช้งาน</h2>
          <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-emerald-100 text-emerald-700">{{ users().length }} users</span>
        </div>
        <div class="grid gap-4">
          @for (user of users(); track user.username) {
            <div class="flex items-center justify-between p-5 backdrop-blur-sm bg-gradient-to-r from-white/60 to-emerald-50/40 rounded-xl border border-white/30 hover:border-emerald-300/50 hover:shadow-lg transition-all duration-300 group">
              <div class="flex-1">
                <p class="font-bold text-slate-700 group-hover:text-emerald-600 transition-colors">{{ user.username }}</p>
                <p class="text-sm text-slate-500">{{ user.email }}</p>
              </div>
              <div class="flex items-center gap-3 ml-4">
                  <span [class]="user.role === 'admin' ? 'bg-gradient-to-r from-purple-100 to-purple-50 text-purple-700 border border-purple-200/50' : 'bg-gradient-to-r from-emerald-100 to-emerald-50 text-emerald-700 border border-emerald-200/50'" 
                        class="px-3 py-1.5 text-xs font-bold rounded-full shadow-sm">
                      {{ user.role === 'admin' ? 'Admin' : 'User' }}
                  </span>

                  <div class="flex items-center gap-2 pl-3 border-l border-slate-200/30">
                    <button (click)="editUser(user)" 
                            class="p-2 text-slate-400 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-all duration-200 transform hover:scale-110" 
                            title="แก้ไขข้อมูล">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                        </svg>
                    </button>

                    <button (click)="deleteUser(user.username)" 
                            class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all duration-200 transform hover:scale-110" 
                            title="ลบผู้ใช้งาน">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                  </div>
              </div>
            </div>
          }
        </div>
      </div>

    </div>
  </div>
</main>
