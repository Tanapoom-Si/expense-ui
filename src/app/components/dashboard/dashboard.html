<div class="w-full bg-transparent font-sans">
  <div class="w-full space-y-6">

    @if (isLoading()) {
    <div
      class="flex flex-col items-center justify-center py-20 backdrop-blur-xl bg-white/80 rounded-2xl shadow-xl border border-white/20">
      <div class="relative w-16 h-16 mb-4">
        <div class="absolute inset-0 bg-gradient-to-r from-emerald-400 to-emerald-600 rounded-full animate-spin"></div>
        <div class="absolute inset-2 bg-white rounded-full"></div>
      </div>
      <p class="text-slate-600 font-medium">กำลังโหลดข้อมูล...</p>
    </div>
    } @else if (hasError()) {
    <div class="text-center py-16 backdrop-blur-xl bg-white/80 rounded-2xl shadow-xl border border-white/20">
      <div class="mb-4 text-6xl">⚠️</div>
      <p class="text-xl font-semibold text-red-600 mb-2">ไม่สามารถโหลดข้อมูลได้</p>
      <button (click)="loadData()"
        class="bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white px-6 py-2.5 rounded-lg font-medium shadow-lg transition-all">
        ลองใหม่
      </button>
    </div>
    } @else {

    <!-- Header -->
    <div class="flex justify-between">
      <div>สรุปรายการ</div>
      <div class="flex flex-wrap gap-2">
        <div class="px-4">
          <button (click)="setRange(7)"
            class="bg-transparent hover:bg-emerald-500 text-black-700 font-semibold py-2 px-4 border border-grey-500 hover:border-transparent rounded transition-colors"
            [class.bg-emerald-500]="selectedRangeDays === 7" [class.text-white]="selectedRangeDays === 7"
            [class.border-emerald-500]="selectedRangeDays === 7">
            7 วัน
          </button>
        </div>
        <div class="px-4"> <button (click)="setRange(14)"
            class="bg-transparent hover:bg-emerald-500 text-black-700 font-semibold py-2 px-4 border border-grey-500 hover:border-transparent rounded transition-colors"
            [class.bg-emerald-500]="selectedRangeDays === 14" [class.text-white]="selectedRangeDays === 14"
            [class.border-emerald-500]="selectedRangeDays === 14">
            14 วัน
          </button>
        </div>
        <div class="px-4"> <button (click)="setRange(30)"
            class="bg-transparent hover:bg-emerald-500 text-black-700 font-semibold py-2 px-4 border border-grey-500 hover:border-transparent rounded transition-colors"
            [class.bg-emerald-500]="selectedRangeDays === 30" [class.text-white]="selectedRangeDays === 30"
            [class.border-emerald-500]="selectedRangeDays === 30">
            เดือนนี้
          </button>
        </div>
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">

      <div
        class="sm:col-span-2 lg:col-span-1 backdrop-blur-xl bg-gradient-to-br from-emerald-500 via-emerald-600 to-teal-600 rounded-2xl p-6 text-white shadow-2xl border border-white/20 relative overflow-hidden">
        <div class="absolute -right-20 -top-20 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
        <div class="relative z-10">
          <p class="text-emerald-100 text-xs sm:text-sm font-semibold uppercase tracking-wider mb-2">ยอดคงเหลือสุทธิ</p>
          <h2 class="text-3xl sm:text-4xl lg:text-5xl font-bold mb-2">฿ {{ balance() | number }}</h2>
          <p class="text-emerald-100 text-xs sm:text-sm">อัปเดตล่าสุดวันนี้</p>
        </div>
      </div>

      <div
        class="backdrop-blur-xl bg-gradient-to-br from-emerald-50 via-white to-emerald-50 rounded-2xl p-6 border border-emerald-200/30 shadow-lg">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-slate-600 text-xs font-bold uppercase tracking-wider mb-2">รายรับรวม</p>
            <h3 class="text-2xl sm:text-3xl font-bold text-emerald-600">฿ {{ totalIncome() | number }}</h3>
          </div>
          <div class="p-3 bg-gradient-to-br from-emerald-100 to-emerald-50 rounded-xl text-emerald-600 shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
          </div>
        </div>
      </div>

      <div
        class="backdrop-blur-xl bg-gradient-to-br from-red-50 via-white to-red-50 rounded-2xl p-6 border border-red-200/30 shadow-lg">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-slate-600 text-xs font-bold uppercase tracking-wider mb-2">รายจ่ายรวม</p>
            <h3 class="text-2xl sm:text-3xl font-bold text-red-600">฿ {{ totalExpense() | number }}</h3>
          </div>
          <div class="p-3 bg-gradient-to-br from-red-100 to-red-50 rounded-xl text-red-600 shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
            </svg>
          </div>
        </div>
      </div>

    </div>

    <!-- Recent Transactions Preview -->
    <div>
      <div class="flex border-b border-gray-700">

        <button (click)="showChart1()"
          class="flex items-center gap-2 px-4 py-3 border-b-2 transition-colors duration-200"
          [class.text-emerald-500]="currentChart === 1" [class.border-emerald-500]="currentChart === 1"
          [class.text-gray-400]="currentChart !== 1" [class.border-transparent]="currentChart !== 1">
          รายวัน
        </button>

        <button (click)="showChart2()"
          class="flex items-center gap-2 px-4 py-3 border-b-2 transition-colors duration-200"
          [class.text-emerald-500]="currentChart === 2" [class.border-emerald-500]="currentChart === 2"
          [class.text-gray-400]="currentChart !== 2" [class.border-transparent]="currentChart !== 2">
          หมวดหมู่
        </button>

      </div>
      <app-chart [currentChart]="currentChart" [rangeDays]="selectedRangeDays"></app-chart>
    </div>

    <!-- <div class="">
      <div>รายการล่าสุดวันนี้</div>
      <div>
        <div>test</div>
        <div>test</div>
        <div>test</div>
      </div>
    </div> -->

    }
  </div>
</div>
