<main class="min-h-screen bg-slate-50 p-8">
  <div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-extrabold text-slate-800">Expense Dashboard</h1>
      </div>
      <div class="space-y-4">
        <h2 class="text-lg font-semibold text-slate-600">รายการ</h2>
        <div class="grid gap-4">
          @for (user of users(); track user.username) {
            <div class="flex items-center justify-between p-4 bg-slate-50 rounded-lg border border-slate-100 hover:border-emerald-300 transition-all">
              <div>
                <p class="font-bold text-slate-700">{{ user.username }}</p>
                <p class="text-sm text-slate-500">{{ user.email }}</p>
              </div>
              <span class="px-3 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-full">Active</span>
            </div>
          }
        </div>
      </div>

    </div>
  </div>
</main>
