<main class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-emerald-50 to-slate-100 px-4">
  <div class="w-full max-w-md">
    <div class="backdrop-blur-xl bg-white/80 rounded-2xl shadow-xl border border-white/20 p-8 space-y-6">

      <div class="text-center space-y-2">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">
          {{ mode() === 'login' ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก' }}
        </h1>
        <p class="text-slate-600 text-sm">Expense Tracker</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-4">

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider">Username</label>
          <input
            type="text"
            name="username"
            [(ngModel)]="username"
            autocomplete="username"
            class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent bg-white/80 transition-all shadow-sm hover:shadow-md"
            placeholder="กรอก username">
        </div>

        @if (mode() === 'register') {
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider">Email</label>
            <input
              type="email"
              name="email"
              [(ngModel)]="email"
              autocomplete="email"
              class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent bg-white/80 transition-all shadow-sm hover:shadow-md"
              placeholder="example@email.com">
          </div>
        }

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider">Password</label>
          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            [autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
            class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent bg-white/80 transition-all shadow-sm hover:shadow-md"
            placeholder="กรอก password">
        </div>

        @if (errorMessage()) {
          <div class="px-4 py-2.5 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
            {{ errorMessage() }}
          </div>
        }

        <button
          type="submit"
          [disabled]="isSubmitting()"
          class="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-bold py-2.5 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
          @if (isSubmitting()) {
            <span>กำลังดำเนินการ...</span>
          } @else {
            <span>{{ mode() === 'login' ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก' }}</span>
          }
        </button>

      </form>

      <div class="text-center text-sm text-slate-600">
        {{ mode() === 'login' ? 'ยังไม่มีบัญชี?' : 'มีบัญชีอยู่แล้ว?' }}
        <button
          type="button"
          (click)="switchMode()"
          class="ml-1 font-semibold text-emerald-600 hover:text-emerald-700 hover:underline transition-colors">
          {{ mode() === 'login' ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ' }}
        </button>
      </div>

    </div>
  </div>
</main>
